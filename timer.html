<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Timer | Ahmed Hamdi Sakr</title>
    <meta name="description" content="Exam countdown timer and live local-time clock with quick notes, for use in class and exams." />

    <script defer src="https://cdn.jsdelivr.net/npm/feather-icons@4.29.2/dist/feather.min.js"></script>
    <link href="/styles.css" rel="stylesheet" />
    <link href="/timer.css" rel="stylesheet" />
    <link rel="icon" type="image/x-icon" href="/images/icon.ico" />
    <script defer src="/app.js"></script>
</head>

<body data-page="timer">
    <div id="site-nav"></div>
    <div class="site-container">
        <!-- Main -->
        <main id="main" class="page page--stack fade-in">
            <h1 class="sr-only">Timer</h1>

            <!-- Card: Current Time / Timer -->
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title">
                        <i data-feather="clock"></i>
                        <h2 class="title-lg" id="cardTitle">Current Time</h2>
                    </div>
                    <div class="toggle-group">
                        <span class="chip" id="nowChip" hidden></span>
                        <span class="chip" id="bgChip" hidden></span>
                        <span class="mode-label" id="lblClock" data-active="true">Clock</span>
                        <button type="button" class="switch" id="modeSwitch" role="switch" aria-checked="false"
                            aria-label="Switch between clock and countdown timer"><span class="knob"></span></button>
                        <span class="mode-label" id="lblTimer" data-active="false">Timer</span>
                    </div>
                </div>

                <div class="viewstack">
                <div id="clockView" class="view">
                <!-- Local clock: uses the device's own time zone (no location permission, no third-party script) -->
                <div class="bigclock" id="bigClock">
                    <div class="bc-label">Current Time</div>
                    <div class="bc-time" aria-label="Current local time">
                        <span id="bcH">--</span><span class="bc-colon" aria-hidden="true"><i></i><i></i></span><span id="bcM">--</span><small id="bcAp" hidden></small>
                    </div>
                    <div class="bc-date" id="bcDate"></div>
                    <div class="bc-zone" id="bcZone"></div>
                </div>
                </div>

                <!-- Countdown timer view -->
                <div id="timerView" class="view is-off" aria-hidden="true" inert>
                    <div class="tdisp" id="timerDisplay" role="timer" aria-label="Countdown timer" data-state="">
                        <div class="tile"><span id="tH">01</span></div>
                        <div class="colon" aria-hidden="true"><i></i><i></i></div>
                        <div class="tile"><span id="tM">00</span></div>
                        <div class="colon" aria-hidden="true"><i></i><i></i></div>
                        <div class="tile"><span id="tS">00</span></div>
                        <div class="tlabel">Hours</div><div></div>
                        <div class="tlabel">Minutes</div><div></div>
                        <div class="tlabel">Seconds</div>
                    </div>

                    <p class="timer-msg" id="timerMsg" role="status"
                        aria-live="polite" style="min-height:1.75rem"></p>

                    <div class="timer-actions">
                        <button type="button" class="btn btn-secondary" id="btnReset">
                            <i data-feather="rotate-ccw" class="icon-4"></i><span>Reset</span>
                        </button>
                        <button type="button" class="btn btn-primary" id="btnStart">
                            <span id="icoPlay"><i data-feather="play" class="icon-4"></i></span>
                            <span id="icoPause" hidden><i data-feather="pause" class="icon-4"></i></span>
                            <span id="startLabel">Start</span>
                        </button>
                        <button type="button" class="btn btn-secondary" id="btnAdd1" title="Add one minute">+1 min</button>
                        <button type="button" class="btn btn-secondary" id="btnAdd5" title="Add five minutes">+5 min</button>
                    </div>

                    <div class="preset-row" id="presets" role="group" aria-label="Timer length">
                        <button type="button" class="chip preset" data-sec="900" aria-pressed="false">15 min</button>
                        <button type="button" class="chip preset" data-sec="1800" aria-pressed="false">30 min</button>
                        <button type="button" class="chip preset" data-sec="2700" aria-pressed="false">45 min</button>
                        <button type="button" class="chip preset" data-sec="3600" aria-pressed="true">1 hr</button>
                        <button type="button" class="chip preset" data-sec="5400" aria-pressed="false">1.5 hr</button>
                        <button type="button" class="chip preset" data-sec="7200" aria-pressed="false">2 hr</button>
                        <button type="button" class="chip preset" data-sec="10800" aria-pressed="false">3 hr</button>
                        <button type="button" class="chip preset" data-manual="1" aria-pressed="false">Manual</button>
                    </div>

                    <div class="manual-row" id="manualBox" hidden>
                        <label class="mlab">Hours<input class="minput" id="mH" type="number" min="0" max="99" value="0" inputmode="numeric" /></label>
                        <span class="colon-sep" aria-hidden="true">:</span>
                        <label class="mlab">Minutes<input class="minput" id="mM" type="number" min="0" max="59" value="0" inputmode="numeric" /></label>
                        <span class="colon-sep" aria-hidden="true">:</span>
                        <label class="mlab">Seconds<input class="minput" id="mS" type="number" min="0" max="59" value="0" inputmode="numeric" /></label>
                    </div>
                </div>
                <!-- /Countdown timer view -->
                </div>


                <div class="timer-tools">
                    <button id="fsBtn" type="button"
                        class="btn btn-primary">
                        <span id="fsEnter"><i data-feather="maximize-2"></i></span>
                        <span id="fsExit" hidden><i data-feather="minimize-2"></i></span>
                        <span id="fsLabel">Fullscreen</span>
                    </button>
                    <div class="awake-toggle">
                        <button type="button" class="switch" id="awakeSwitch" role="switch" aria-checked="true"
                            aria-label="Keep screen awake"><span class="knob"></span></button>
                        <span class="text-sm text-soft nowrap">Keep screen awake</span>
                    </div>
                </div>
            </div>

            <!-- Card: Notes -->
            <div class="panel">
                <div class="panel-title">
                    <i data-feather="edit-3"></i>
                    <h3 class="title-md">Quick Notes</h3>
                </div>

                <p class="text-soft mb-2">Use this box for quick reminders.</p>
                <textarea rows="7"
                    class="field field--full field--roomy"
                    placeholder="- Please write your student number on each page"></textarea>
            </div>

        </main>
        <footer class="site-footer fade-in">
            <p>&copy; 2021&ndash;2026 Ahmed Hamdi Sakr. All rights reserved.</p>
        </footer>
    </div>

    <script>
        /* Clock / countdown timer */
        (function () {
            var $ = function (id) { return document.getElementById(id); };
            var sw = $('modeSwitch'), clockView = $('clockView'), timerView = $('timerView');
            var cardTitle = $('cardTitle'), lblClock = $('lblClock'), lblTimer = $('lblTimer'), bgChip = $('bgChip'), nowChip = $('nowChip');
            var disp = $('timerDisplay'), tH = $('tH'), tM = $('tM'), tS = $('tS'), msg = $('timerMsg');
            var btnStart = $('btnStart'), btnReset = $('btnReset'), btnAdd1 = $('btnAdd1'), btnAdd5 = $('btnAdd5');
            var icoPlay = $('icoPlay'), icoPause = $('icoPause'), startLabel = $('startLabel');
            var presets = $('presets'), manualBox = $('manualBox');
            var mH = $('mH'), mM = $('mM'), mS = $('mS');
            var baseTitle = document.title;
            var STORE_KEY = 'examTimer.v1';

            var durationMs = 3600 * 1000, remainingMs = durationMs, endAt = 0;
            var ticker = null, running = false, finished = false, hasStarted = false;
            var audioCtx = null, wakeLock = null;

            function pad(n) { return (n < 10 ? '0' : '') + n; }
            function split(ms) {
                var t = Math.max(0, Math.ceil(ms / 1000));
                return { h: Math.floor(t / 3600), m: Math.floor(t % 3600 / 60), s: t % 60 };
            }
            function clockText(ms) { var p = split(ms); return pad(p.h) + ':' + pad(p.m) + ':' + pad(p.s); }
            function setMsg(text, neutral) { msg.textContent = text || ''; msg.style.color = neutral ? '#6b7280' : ''; }

            function render() {
                var p = split(remainingMs);
                tH.textContent = pad(p.h); tM.textContent = pad(p.m); tS.textContent = pad(p.s);

                var state = '';
                if (finished) state = 'done';
                else if (hasStarted && remainingMs <= 60000) state = 'danger';
                else if (hasStarted && remainingMs <= 300000) state = 'warn';
                disp.setAttribute('data-state', state);

                var paused = !running && !finished && hasStarted;
                startLabel.textContent = running ? 'Pause' : (paused ? 'Resume' : 'Start');
                icoPlay.hidden = running;
                icoPause.hidden = !running;
                btnStart.disabled = (!running && remainingMs <= 0);
                btnReset.disabled = (!running && !finished && !hasStarted);
                btnAdd1.disabled = btnAdd5.disabled = !(hasStarted || finished);

                Array.prototype.forEach.call(presets.querySelectorAll('.preset'), function (b) { b.disabled = running; });
                mH.disabled = mM.disabled = mS.disabled = running;

                document.title = running ? (clockText(remainingMs) + ' | Timer') : baseTitle;

                if (running && timerView.classList.contains('is-off')) {
                    bgChip.hidden = false;
                    bgChip.textContent = 'Timer running \u00b7 ' + clockText(remainingMs);
                } else {
                    bgChip.hidden = true;
                }
            }

            /* ---- remember the countdown across a refresh (this device only) ---- */
            function selection() {
                var b = presets.querySelector('.preset[aria-pressed="true"]');
                return !b ? '3600' : (b.getAttribute('data-manual') ? 'manual' : b.getAttribute('data-sec'));
            }
            function save() {
                try {
                    localStorage.setItem(STORE_KEY, JSON.stringify({
                        savedAt: Date.now(), durationMs: durationMs, hasStarted: hasStarted, finished: finished,
                        running: running, endAt: running ? endAt : 0,
                        remainingMs: running ? Math.max(0, endAt - Date.now()) : remainingMs,
                        sel: selection(), manual: [mH.value, mM.value, mS.value],
                        timerMode: sw.getAttribute('aria-checked') === 'true'
                    }));
                } catch (e) { }
            }
            function clearSaved() { try { localStorage.removeItem(STORE_KEY); } catch (e) { } }

            /* ---- audio alarm + screen wake lock ---- */
            function ensureAudio() {
                try {
                    var Ctx = window.AudioContext || window.webkitAudioContext;
                    if (!audioCtx && Ctx) audioCtx = new Ctx();
                    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                } catch (e) { }
            }
            function alarm() {
                try {
                    ensureAudio();
                    if (!audioCtx) return;
                    var t0 = audioCtx.currentTime;
                    for (var i = 0; i < 6; i++) {
                        var o = audioCtx.createOscillator(), g = audioCtx.createGain(), at = t0 + i * 0.5;
                        o.type = 'sine';
                        o.frequency.value = (i % 2) ? 660 : 880;
                        g.gain.setValueAtTime(0, at);
                        g.gain.linearRampToValueAtTime(0.25, at + 0.02);
                        g.gain.linearRampToValueAtTime(0, at + 0.4);
                        o.connect(g); g.connect(audioCtx.destination);
                        o.start(at); o.stop(at + 0.45);
                    }
                } catch (e) { }
            }
            /* ---- keep the screen awake (independent of the countdown; works in Clock and Timer mode) ---- */
            var AWAKE_KEY = 'examTimer.awake';
            var awakeSw = $('awakeSwitch');
            var awakeOn = true, wakePending = false;
            try { if (localStorage.getItem(AWAKE_KEY) === '0') awakeOn = false; } catch (e) { }
            var wakeSupported = !!(navigator.wakeLock && navigator.wakeLock.request);

            function awakeStatus() {                         // no visible tag: the state is kept as the switch's tooltip
                var text;
                if (!wakeSupported) text = 'Keep screen awake: not supported in this browser';
                else if (!awakeOn) text = 'Keep screen awake: off (the screen may sleep)';
                else if (wakeLock) text = 'Keep screen awake: active';
                else if (document.visibilityState !== 'visible') text = 'Keep screen awake: paused while the tab is hidden';
                else text = 'Keep screen awake: not active, click the page to retry';
                awakeSw.title = text;
                awakeSw.setAttribute('aria-checked', awakeOn ? 'true' : 'false');
            }
            function requestWake() {
                if (!awakeOn || !wakeSupported || wakeLock || wakePending) return;
                wakePending = true;
                navigator.wakeLock.request('screen').then(function (l) {
                    wakePending = false;
                    wakeLock = l;
                    l.addEventListener('release', function () { if (wakeLock === l) wakeLock = null; awakeStatus(); });
                    awakeStatus();
                }).catch(function () { wakePending = false; awakeStatus(); });   // e.g. battery saver or tab not visible
            }
            function releaseWake() {
                var l = wakeLock; wakeLock = null;
                try { if (l) l.release(); } catch (e) { }
                awakeStatus();
            }
            awakeSw.addEventListener('click', function () {
                awakeOn = !awakeOn;
                try { localStorage.setItem(AWAKE_KEY, awakeOn ? '1' : '0'); } catch (e) { }
                if (awakeOn) requestWake(); else releaseWake();
                awakeStatus();
            });
            document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'visible') requestWake();   // the browser drops the lock when the tab is hidden
                awakeStatus();
            });
            window.addEventListener('focus', requestWake);
            document.addEventListener('pointerdown', function () { if (awakeOn && !wakeLock) requestWake(); }, true);

            /* ---- countdown control ---- */
            function tick() {
                remainingMs = endAt - Date.now();
                if (remainingMs <= 0) { finish(); return; }
                render();
            }
            function start() {
                if (running || remainingMs <= 0) return;
                ensureAudio();                               // created inside the click so the alarm is allowed to play
                endAt = Date.now() + remainingMs;            // wall-clock based: stays accurate even if the tab is throttled
                running = true; finished = false; hasStarted = true; setMsg('');
                ticker = setInterval(tick, 250);
                requestWake();
                render(); save();
            }
            function pause() {
                if (!running) return;
                remainingMs = Math.max(0, endAt - Date.now());
                clearInterval(ticker); running = false;
                render(); save();
            }
            function reset() {
                clearInterval(ticker); running = false; finished = false; hasStarted = false;
                remainingMs = durationMs; setMsg('');
                render(); save();
            }
            function finish() {
                clearInterval(ticker); running = false; finished = true; remainingMs = 0;
                setMsg("Time's up!");
                alarm();
                render(); save();
            }
            function addTime(ms) {
                if (finished) {                              // extra time after "Time's up": restart the countdown with it
                    finished = false; remainingMs = ms; setMsg('');
                    start();
                    return;
                }
                if (!hasStarted) return;
                remainingMs += ms;
                if (running) endAt += ms;
                render(); save();
            }

            btnStart.addEventListener('click', function () { running ? pause() : start(); });
            btnReset.addEventListener('click', reset);
            btnAdd1.addEventListener('click', function () { addTime(60 * 1000); });
            btnAdd5.addEventListener('click', function () { addTime(5 * 60 * 1000); });

            /* ---- presets and manual entry ---- */
            function manualSeconds() {
                function clamp(el, max) {
                    var v = parseInt(el.value, 10); if (isNaN(v) || v < 0) v = 0; if (v > max) v = max;
                    return v;
                }
                return clamp(mH, 99) * 3600 + clamp(mM, 59) * 60 + clamp(mS, 59);
            }
            presets.addEventListener('click', function (e) {
                var b = e.target.closest ? e.target.closest('.preset') : null;
                if (!b || running) return;
                Array.prototype.forEach.call(presets.querySelectorAll('.preset'), function (x) {
                    x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
                });
                if (b.getAttribute('data-manual')) {
                    manualBox.hidden = false;
                    durationMs = manualSeconds() * 1000;
                } else {
                    manualBox.hidden = true;
                    durationMs = parseInt(b.getAttribute('data-sec'), 10) * 1000;
                }
                reset();
            });
            [mH, mM, mS].forEach(function (inp) {
                inp.addEventListener('input', function () {
                    if (running) return;
                    durationMs = manualSeconds() * 1000;
                    reset();
                });
            });

            /* ---- Clock / Timer switch ---- */
            function setMode(on) {
                sw.setAttribute('aria-checked', on ? 'true' : 'false');
                timerView.classList.toggle('is-off', !on);
                clockView.classList.toggle('is-off', on);
                timerView.setAttribute('aria-hidden', on ? 'false' : 'true');
                clockView.setAttribute('aria-hidden', on ? 'true' : 'false');
                if (on) { timerView.removeAttribute('inert'); clockView.setAttribute('inert', ''); }
                else { clockView.removeAttribute('inert'); timerView.setAttribute('inert', ''); }
                cardTitle.textContent = on ? 'Timer' : 'Current Time';
                lblClock.setAttribute('data-active', on ? 'false' : 'true');
                lblTimer.setAttribute('data-active', on ? 'true' : 'false');
                nowChip.hidden = !on;
                render();
            }
            sw.addEventListener('click', function () {
                setMode(sw.getAttribute('aria-checked') !== 'true');
                save();
            });

            /* ---- local time: big clock in Clock mode, small tag in Timer mode (device time zone, no location permission) ---- */
            var bcH = $('bcH'), bcM = $('bcM'), bcAp = $('bcAp'), bcDate = $('bcDate'), bcZone = $('bcZone');
            var tzId = '';
            try { tzId = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) { }
            var tf = new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit' });
            var tzShortFmt = new Intl.DateTimeFormat(undefined, { hour: 'numeric', timeZoneName: 'short' });
            var tzLongFmt = new Intl.DateTimeFormat(undefined, { hour: 'numeric', timeZoneName: 'long' });
            var dfLong = new Intl.DateTimeFormat(undefined, { weekday: 'short', month: 'long', day: 'numeric' });
            var dfShort = new Intl.DateTimeFormat(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
            function partOf(fmt, d, type) {
                var r = '';
                fmt.formatToParts(d).forEach(function (p) { if (p.type === type) r = p.value; });
                return r;
            }
            function updateNow() {
                var d = new Date(), h = '', m = '', ap = '';
                tf.formatToParts(d).forEach(function (p) {
                    if (p.type === 'hour') h = p.value;
                    else if (p.type === 'minute') m = p.value;
                    else if (p.type === 'dayPeriod') ap = p.value.toLowerCase();
                });
                var shortName = partOf(tzShortFmt, d, 'timeZoneName'), longName = partOf(tzLongFmt, d, 'timeZoneName');
                bcH.textContent = h; bcM.textContent = m;
                bcAp.textContent = ap; bcAp.hidden = !ap;               // 24-hour locales have no am/pm
                bcDate.textContent = dfLong.format(d);
                bcZone.textContent = longName + (tzId ? ' \u00b7 ' + tzId.replace(/_/g, ' ') : '');
                nowChip.textContent = h + ':' + m + (ap ? ' ' + ap : '') + (shortName ? ' ' + shortName : '') + ' \u00b7 ' + dfShort.format(d);
            }
            function scheduleNow() {                                   // re-run right after each second boundary so the seconds tile never lags
                updateNow();
                setTimeout(scheduleNow, 1000 - (Date.now() % 1000) + 5);
            }
            scheduleNow();

            /* ---- restore after a refresh / crash / tab restore ---- */
            function restore() {
                var st = null;
                try { st = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) { }
                if (!st || typeof st.durationMs !== 'number') return;
                var age = Date.now() - st.savedAt;
                if (age > (st.finished ? 3600000 : 12 * 3600000)) { clearSaved(); return; }   // stale

                var found = false;
                Array.prototype.forEach.call(presets.querySelectorAll('.preset'), function (b) {
                    var match = b.getAttribute('data-manual') ? st.sel === 'manual' : b.getAttribute('data-sec') === st.sel;
                    b.setAttribute('aria-pressed', match ? 'true' : 'false');
                    if (match) found = true;
                });
                if (!found) return;
                manualBox.hidden = st.sel !== 'manual';
                if (st.manual && st.manual.length === 3) { mH.value = st.manual[0]; mM.value = st.manual[1]; mS.value = st.manual[2]; }

                durationMs = st.durationMs; hasStarted = !!st.hasStarted; finished = !!st.finished;
                if (st.running) {
                    var left = st.endAt - Date.now();
                    if (left > 0) {
                        remainingMs = left; endAt = st.endAt; running = true;
                        ticker = setInterval(tick, 250);
                        requestWake();
                        setMsg('Restored after reload \u2014 click anywhere to enable the alarm sound.', true);
                        var unlock = function () { ensureAudio(); if (running) setMsg(''); };
                        document.addEventListener('pointerdown', unlock, { once: true });
                        document.addEventListener('keydown', unlock, { once: true });
                    } else {                                 // ran out while the page was closed
                        remainingMs = 0; finished = true; running = false; hasStarted = true;
                        setMsg("Time's up!");
                    }
                } else {
                    remainingMs = st.remainingMs;
                    if (finished) setMsg("Time's up!");
                }
                if (st.timerMode) setMode(true);
                render();
            }

            render();
            restore();
            awakeStatus();
            requestWake();
        })();
    </script>

    <script>
        /* Fullscreen toggle: enters fullscreen, or exits if already in it */
        (function () {
            var btn = document.getElementById('fsBtn'), enter = document.getElementById('fsEnter'),
                exit = document.getElementById('fsExit'), label = document.getElementById('fsLabel');
            function isFs() {
                return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
            }
            function toggleFullscreen() {
                var el = document.documentElement, p;
                if (isFs()) {
                    var ex = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
                    if (ex) p = ex.call(document);
                } else {
                    var rq = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
                    if (rq) p = rq.call(el);
                }
                if (p && p.catch) p.catch(function () { });
            }
            function sync() {
                var on = isFs();
                enter.hidden = on;
                exit.hidden = !on;
                label.textContent = on ? 'Exit fullscreen' : 'Fullscreen';
            }
            btn.addEventListener('click', toggleFullscreen);
            ['fullscreenchange', 'webkitfullscreenchange', 'MSFullscreenChange'].forEach(function (ev) {
                document.addEventListener(ev, sync);
            });
            sync();
        })();
    </script>
</body>

</html>
